name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUXT_PUBLIC_SITE_ORIGIN: https://reclash.pages.dev
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Stamp deployment artifact
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(".output/public/deployment.json", JSON.stringify({ commit: process.env.GITHUB_SHA }) + "\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: .output/public
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7

  deploy:
    if: github.repository == 'Hoxiee/reclash-site' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://reclash.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: .output/public
      - name: Deploy verified site and Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2adf62c1e0b34e7455eabdde6ee1c817
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission in this repository.'
            exit 1
          fi
          npx --no-install wrangler pages deploy --project-name reclash --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify production
        run: node scripts/check-deployment.mjs https://reclash.pages.dev
      - name: Publish deployment summary
        run: |
          {
            echo '## Production deployment'
            echo '- Site: https://reclash.pages.dev'
            echo "- Commit: $GITHUB_SHA"
            echo '- Artifact: pages-site (verified by static checks and browser tests)'
          } >> "$GITHUB_STEP_SUMMARY"
