<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ember background">
  <defs>
    <linearGradient id="e-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120704"/><stop offset=".5" stop-color="#331206"/>
      <stop offset=".82" stop-color="#8a320a"/><stop offset="1" stop-color="#c85a14"/>
    </linearGradient>
    <radialGradient id="e-vig" cx=".5" cy=".42" r=".72">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="e-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
