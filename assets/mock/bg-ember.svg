    <circle cx="700" cy="880" r="48" fill="#FFD9A0" opacity=".55"/>
    <circle cx="900" cy="720" r="66" fill="#FF6B1A" opacity=".38"/>
    <circle cx="360" cy="1180" r="96" fill="#FF7A1A" opacity=".26"/>
    <circle cx="800" cy="1240" r="72" fill="#FFC46B" opacity=".3"/>
  </g>
  <ellipse cx="540" cy="1900" rx="1040" ry="360" fill="#FF6B1A" opacity=".3" filter="url(#e-soft)"/>
